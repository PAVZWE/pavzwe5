<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بلازما TV - جميع القنوات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0b0b0b; color: #fff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
            transition: opacity 0.5s ease;
        }
        #loadingScreen.hidden { opacity: 0; pointer-events: none; }
        #loadingScreen .loader-icon { font-size: 50px; color: #e50914; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 0.7; } }
        #loadingScreen .loader-text { font-size: 20px; color: #ccc; letter-spacing: 1px; }
        #loadingScreen .loader-text span { color: #e50914; font-weight: 700; }
        .progress-bar-bg { width: 80%; max-width: 400px; height: 6px; background: #222; border-radius: 30px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #e50914, #ff4466); border-radius: 30px; transition: width 0.2s ease; }
        .progress-percent { font-size: 16px; color: #999; }

        #mainApp { display: none; flex-direction: column; min-height: 100vh; }
        #mainApp.visible { display: flex; }

        .top-bar {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            padding: 12px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #2a2a2a;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 10;
            transition: all 0.3s;
        }
        .top-bar.hidden { display: none; }

        .top-bar .brand { display: flex; align-items: center; gap: 10px; }
        .top-bar .brand i { font-size: 28px; color: #e50914; text-shadow: 0 0 20px rgba(229,9,20,0.5); }
        .top-bar .brand span { font-size: 24px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(45deg, #f5f5f5, #aaaaaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .top-bar .brand small { font-size: 13px; color: #888; -webkit-text-fill-color: #888; margin-left: 6px; }
        .top-bar .search-box { display: flex; align-items: center; background: #222; border-radius: 30px; padding: 4px 15px; border: 1px solid #444; transition: 0.3s; }
        .top-bar .search-box:focus-within { border-color: #e50914; box-shadow: 0 0 15px rgba(229,9,20,0.3); }
        .top-bar .search-box input { background: transparent; border: none; padding: 8px 8px; color: #fff; font-size: 15px; width: 170px; outline: none; }
        .top-bar .search-box input::placeholder { color: #777; }
        .top-bar .search-box i { color: #999; font-size: 16px; }

        .plasma-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 75px);
            background: #0a0a0a;
            padding: 12px;
            gap: 12px;
            transition: all 0.3s;
        }
        .plasma-container.fullscreen-mode .player-area {
            flex: 1;
        }
        .plasma-container.fullscreen-mode .channel-list {
            display: none;
        }

        .player-area {
            flex: 3;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(229,9,20,0.15), inset 0 0 40px rgba(0,0,0,0.8);
            border: 2px solid #2a2a2a;
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .player-area video {
            width: 100%;
            height: 100%;
            display: block;
            background: #0a0a0a;
            object-fit: contain;
        }
        .player-area .watermark {
            position: absolute;
            bottom: 15px;
            left: 20px;
            color: rgba(255,255,255,0.12);
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 5;
        }
        .fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            border: 1px solid #444;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-btn:hover { background: #e50914; border-color: #e50914; transform: scale(1.05); }

        .channel-list {
            flex: 1.2;
            background: #121212;
            border-radius: 16px;
            padding: 8px 0 8px 8px;
            overflow-y: auto;
            border: 2px solid #222;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            min-width: 240px;
            max-width: 340px;
            scroll-behavior: smooth;
            transition: all 0.3s;
        }
        .channel-list.hidden { display: none; }

        .channel-list::-webkit-scrollbar { width: 5px; }
        .channel-list::-webkit-scrollbar-thumb { background: #e50914; border-radius: 10px; }
        .channel-list::-webkit-scrollbar-track { background: #1a1a1a; }

        .category-title {
            font-size: 14px;
            font-weight: 700;
            color: #e50914;
            padding: 10px 12px 4px 8px;
            border-bottom: 1px solid #2a2a2a;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .category-title i { font-size: 15px; }
        .category-title .count { margin-left: auto; font-size: 11px; color: #666; }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px 8px 8px;
            margin: 3px 6px 3px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: transparent;
            border-left: 3px solid transparent;
        }
        .channel-item:hover { background: #1e1e1e; border-left-color: #e50914; transform: translateX(3px); }
        .channel-item.active { background: #1e1e1e; border-left-color: #e50914; box-shadow: 0 0 12px rgba(229,9,20,0.15); }
        .channel-item.focus { outline: 2px solid #ffaa00; outline-offset: -2px; background: #1e1e1e; border-left-color: #ffaa00; }
        .channel-item img { width: 34px; height: 34px; object-fit: contain; border-radius: 6px; background: #222; padding: 3px; flex-shrink: 0; }
        .channel-item .ch-info { flex: 1; min-width: 0; }
        .channel-item .ch-info .ch-name { font-size: 14px; font-weight: 500; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
        .channel-item .ch-info .ch-group { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: 0.5px; }

        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); }
        .status-dot.green { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        .status-dot.red { background: #ff2244; box-shadow: 0 0 10px #ff2244; }

        .channel-item .ch-badge {
            background: #2a2a2a;
            color: #999;
            font-size: 9px;
            padding: 2px 7px;
            border-radius: 30px;
            white-space: nowrap;
        }

        /* مؤشر الفارة */
        .giant-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
        .giant-cursor.active {
            display: block;
        }
        .giant-cursor .cursor-dot {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 4px solid #ffaa00;
            box-shadow: 0 0 40px rgba(255, 170, 0, 0.6), inset 0 0 30px rgba(255, 170, 0, 0.2);
            transform: translate(-50%, -50%);
            transition: none;
            pointer-events: none;
        }
        .giant-cursor .cursor-dot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background: #ffaa00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #ffaa00;
        }
        .giant-cursor .cursor-ring {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 170, 0, 0.3);
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: spin 6s linear infinite;
        }
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .cursor-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffaa00;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 18px;
            border: 1px solid #ffaa00;
            z-index: 10000;
            display: none;
            text-align: center;
            backdrop-filter: blur(10px);
            pointer-events: none;
        }
        .cursor-hint.active { display: block; }
        .cursor-hint i { margin: 0 8px; }

        @media (max-width: 992px) {
            .plasma-container { flex-direction: column; height: auto; padding: 8px; }
            .player-area { min-height: 250px; flex: unset; height: 45vh; }
            .channel-list { flex: unset; max-width: 100%; max-height: 350px; min-width: unset; }
            .top-bar .search-box input { width: 120px; }
        }
        @media (max-width: 600px) {
            .top-bar { flex-direction: column; align-items: stretch; padding: 10px 15px; }
            .top-bar .brand span { font-size: 20px; }
            .player-area { height: 35vh; min-height: 180px; }
            .channel-item { padding: 6px 8px; }
            .channel-item img { width: 28px; height: 28px; }
            .progress-bar-bg { width: 90%; }
            .giant-cursor .cursor-dot { width: 60px; height: 60px; }
            .giant-cursor .cursor-ring { width: 100px; height: 100px; }
        }
    </style>
</head>

        // ================================================================
        //  6. دالة تحليل M3U المتطورة (تدعم جميع التنسيقات مع استخراج الشعار)
        // ================================================================
        function parseM3U(text) {
            const lines = text.split('\n');
            const channels = [];
            let currentName = '';
            let currentLogo = 'https://via.placeholder.com/34/222/666?text=TV';
            let currentGroup = 'عام';
            let currentCountry = 'INT';
            let currentUrl = '';

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                if (line.startsWith('#EXTM3U')) continue;
                if (line.startsWith('#EXTVLCOPT')) continue;

                if (line.startsWith('#EXTINF')) {
                    // استخراج tvg-logo
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    if (logoMatch && logoMatch[1]) {
                        currentLogo = logoMatch[1];
                    } else {
                        currentLogo = 'https://via.placeholder.com/34/222/666?text=TV';
                    }
                    // استخراج tvg-country
                    const countryMatch = line.match(/tvg-country="([^"]*)"/);
                    if (countryMatch && countryMatch[1]) {
                        currentCountry = countryMatch[1].split(';')[0].trim();
                    } else {
                        currentCountry = 'INT';
                    }
                    // استخراج group-title
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    if (groupMatch && groupMatch[1]) {
                        currentGroup = groupMatch[1].split(';')[0].trim();
                    } else {
                        currentGroup = 'عام';
                    }
                    // استخراج الاسم (آخر فاصلة)
                    const nameMatch = line.match(/,([^,]+)$/);
                    if (nameMatch) {
                        currentName = nameMatch[1].trim();
                    } else {
                        currentName = 'قناة بدون اسم';
                    }
                    // محاولة استخراج البلد من الاسم بين قوسين
                    const parenCountry = currentName.match(/\(([A-Z]{2})\)/);
                    if (parenCountry) {
                        currentCountry = parenCountry[1];
                    }
                    currentUrl = '';
                } else if (line.startsWith('http://') || line.startsWith('https://')) {
                    currentUrl = line.trim();
                    if (currentName && currentUrl) {
                        channels.push({
                            name: currentName,
                            logo: currentLogo,
                            url: currentUrl,
                            country: currentCountry,
                            group: currentGroup
                        });
                        currentName = '';
                        currentLogo = 'https://via.placeholder.com/34/222/666?text=TV';
                        currentUrl = '';
                    }
                } else {
                    // السطر لا يبدأ بـ #EXTINF ولا برابط، ربما يكون اسم ورابط في نفس السطر (مثل pavzwe القديم)
                    const urlMatch = line.match(/(https?:\/\/[^\s]+)/);
                    if (urlMatch) {
                        const url = urlMatch[1];
                        const namePart = line.substring(0, line.indexOf(url)).trim();
                        if (namePart) {
                            const name = namePart.replace(/\s*$/, '');
                            let group = 'عام';
                            let country = 'INT';
                            const lower = name.toLowerCase();
                            if (/رياضة|sport|spor|lig|bein|alkass|fight|box|motor|kombat|eurosport/.test(lower)) group = 'رياضة';
                            else if (/فيلم|movies|cinema|aflam|bollywood|boxoffice/.test(lower)) group = 'أفلام';
                            else if (/مسلسل|series|drama|hekayat|musalsat/.test(lower)) group = 'مسلسلات';
                            else if (/أطفال|kids|junior|cartoon|disney|nick|spacetoon/.test(lower)) group = 'أطفال';
                            else if (/اخبار|news|haber/.test(lower)) group = 'أخبار';
                            else if (/وثائقي|documentary|discovery|nat geo|history|planet/.test(lower)) group = 'وثائقي';
                            if (/.tr\b/.test(url) || /turkey|trt|kanal|atv|show|star|now|cnbc|tv8|euro/.test(lower)) country = 'TR';
                            else if (/.fr\b/.test(url) || /sfr|bein.*fr|eurosport.*fr/.test(lower)) country = 'FR';
                            else if (/.uk\b/.test(url) || /sky|bt|mutv|lfctv|chelsea|eir/.test(lower)) country = 'UK';
                            else if (/.de\b/.test(url) || /bundesliga|sky.*de/.test(lower)) country = 'DE';
                            else if (/.nl\b/.test(url) || /fox.*nl|sport.*nl/.test(lower)) country = 'NL';
                            else if (/\bAR\b/.test(name) || name.startsWith('AR:')) country = 'AR';
                            else if (/iraq|aliraqia|alforat|dijla|rudaw|kurd|nrt/.test(lower)) country = 'IQ';
                            else if (/algerie|dz|echorouk|elbilad|canal|africa/.test(lower)) country = 'DZ';
                            const logo = 'https://via.placeholder.com/34/222/666?text=TV';
                            channels.push({
                                name: name,
                                logo: logo,
                                url: url,
                                country: country,
                                group: group
                            });
                        }
                    }
                }
            }
            return channels;
        }

        // ================================================================

        async function quickTest(url) {
            if (!url) return false;
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 1500);
                const res = await fetch(url, {
                    method: 'HEAD',
                    headers: { 'User-Agent': 'Mozilla/5.0' },
                    signal: controller.signal,
                    mode: 'cors'
                });
                clearTimeout(timeout);
                return res.ok || res.status === 206;
            } catch { return false; }
        }

        // ================================================================

        // دالة العرض مع التركيز
        function renderActiveChannels(filter = '') {
            const container = document.getElementById('channelList');
            container.innerHTML = '';
            const lowerFilter = filter.toLowerCase();

            if (activeChannels.length === 0) {
                container.innerHTML = `<div style="padding:20px;text-align:center;color:#555;"><i class="fas fa-satellite-dish" style="font-size:30px;display:block;margin-bottom:10px;"></i>جاري البحث عن قنوات شغالة...</div>`;
                return;
            }

            // تجميع حسب المنطقة
            const regions = {};
            activeChannels.forEach(ch => {
                const region = getRegion(ch.country);
                if (!regions[region]) regions[region] = [];
                regions[region].push(ch);
            });

            const regionOrder = ['🇹🇷 تركيا', '🇩🇿 الجزائر', '🇮🇶 العراق', '🇫🇷 فرنسا', '🇬🇧 بريطانيا', '🇩🇪 ألمانيا', '🇳🇱 هولندا', '🌍 العربية'];
            const sortedRegions = Object.keys(regions).sort((a, b) => {
                const indexA = regionOrder.indexOf(a);
                const indexB = regionOrder.indexOf(b);
                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                if (indexA !== -1) return -1;
                if (indexB !== -1) return 1;
                return a.localeCompare(b);
            });

            let hasResults = false;
            let globalIndex = 0;
            sortedRegions.forEach(region => {
                let items = regions[region];
                if (lowerFilter) {
                    items = items.filter(ch => ch.name.toLowerCase().includes(lowerFilter) || ch.group.toLowerCase().includes(lowerFilter));
                }
                if (items.length === 0) return;
                hasResults = true;

                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.innerHTML = `<i class="fas fa-flag"></i> ${region} <span class="count">${items.length}</span>`;
                container.appendChild(titleDiv);

                items.forEach(ch => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    if (currentChannel && currentChannel.url === ch.url) item.classList.add('active');
                    // تحديد التركيز إذا كان هذا العنصر هو العنصر المحدد
                    if (globalIndex === focusedIndex) {
                        item.classList.add('focus');
                    }
                    item.setAttribute('data-index', globalIndex);
                    const logoUrl = ch.logo && ch.logo.startsWith('http') ? ch.logo : 'https://via.placeholder.com/34/222/666?text=TV';
                    item.innerHTML = `

                            <div class="ch-name">

                        playChannel(ch);

                        focusedIndex = globalIndex;
                        renderActiveChannels(document.getElementById('searchInput').value);
                    });
                    container.appendChild(item);
                    globalIndex++;

            if (!hasResults) {
                container.innerHTML = `<div style="padding:20px;text-align:center;color:#555;"><i class="fas fa-search" style="font-size:30px;display:block;margin-bottom:10px;"></i>لا توجد قنوات تطابق البحث</div>`;

                // تحديث موقع المؤشر بناءً على العنصر المحدد
                const items = container.querySelectorAll('.channel-item');
                if (items.length > 0 && focusedIndex < items.length) {
                    const el = items[focusedIndex];

        // دالة تشغيل قناة
        function initHLS(url) {
            if (hls) { hls.destroy(); hls = null; }
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play().catch(() => {});
                return;
            }
            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
                hls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) { hls.loadSource(url); }
                });
            } else {
                video.src = url;
                video.play().catch(() => {});
            }
        }

        function playChannel(channel) {

            }
        }

        async function testNextBatch() {
            if (testingIndex >= allChannels.length) {
                if (!isTestingComplete) {
                    isTestingComplete = true;
                    startPeriodicTesting();
                }
                return;
            }
            const batch = allChannels.slice(testingIndex, testingIndex + 10);

            if (testingIndex < allChannels.length) {

            } else {
                isTestingComplete = true;
                startPeriodicTesting();
            }
        }

        function startPeriodicTesting() {
            if (periodicTimer) clearInterval(periodicTimer);

        }

        // ================================================================
        //  11. التحكم عن بعد (الفارة + أزرار التلفزيون)
        // ================================================================
        function toggleCursor() {
            cursorActive = !cursorActive;
            if (cursorActive) {
                giantCursor.classList.add('active');
                cursorHint.classList.add('active');
                // إخفاء شريط البحث العلوي لتوسيع العرض
                topBar.classList.add('hidden');
                container.classList.add('fullscreen-mode');
                // نبدأ بتركيز أول قناة
                if (activeChannels.length > 0) {
                    focusedIndex = 0;
                    renderActiveChannels(document.getElementById('searchInput').value);
                    // وضع المؤشر على أول قناة
                    const items = channelList.querySelectorAll('.channel-item');
                    if (items.length > 0) {
                        const rect = items[0].getBoundingClientRect();
                        const x = rect.left + rect.width / 2;
                        const y = rect.top + rect.height / 2;
                        cursorDot.style.left = x + 'px';
                        cursorDot.style.top = y + 'px';
                        const ring = document.querySelector('.giant-cursor .cursor-ring');
                        if (ring) {
                            ring.style.left = x + 'px';
                            ring.style.top = y + 'px';
                        }
                    }
                }
                // تعطيل مؤشر الماوس العادي
                document.body.style.cursor = 'none';
            } else {
                giantCursor.classList.remove('active');
                cursorHint.classList.remove('active');
                topBar.classList.remove('hidden');
                container.classList.remove('fullscreen-mode');
                document.body.style.cursor = 'default';
                // إزالة التركيز
                document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('focus'));
            }
        }

        // حدث لوحة المفاتيح للتحكم عن بعد
        document.addEventListener('keydown', (e) => {
            // زر الفاره: نستخدم زر "1" لتفعيل/إلغاء الفارة
            if (e.key === '1' && !e.ctrlKey && !e.altKey && !e.metaKey) {
                e.preventDefault();
                toggleCursor();
                return;
            }

            if (!cursorActive) return;

            const items = channelList.querySelectorAll('.channel-item');
            if (items.length === 0) return;

            let newIndex = focusedIndex;

            switch (e.key) {
                case 'ArrowDown':
                case 'ArrowRight':
                    e.preventDefault();
                    newIndex = Math.min(items.length - 1, focusedIndex + 1);
                    break;
                case 'ArrowUp':
                case 'ArrowLeft':
                    e.preventDefault();
                    newIndex = Math.max(0, focusedIndex - 1);
                    break;
                case 'Enter':
                case ' ':
                    e.preventDefault();
                    // تشغيل القناة المحددة
                    const targetItem = items[focusedIndex];
                    if (targetItem) {
                        const idx = parseInt(targetItem.getAttribute('data-index'));
                        if (!isNaN(idx) && idx < activeChannels.length) {
                            playChannel(activeChannels[idx]);
                            // تحديث التظليل
                            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                            targetItem.classList.add('active');
                        }
                    }
                    return;
                default:
                    return;
            }

            if (newIndex !== focusedIndex) {
                focusedIndex = newIndex;
                // تحديث التركيز
                items.forEach((el, i) => {
                    el.classList.toggle('focus', i === focusedIndex);
                });
                // تحديث موقع المؤشر
                const el = items[focusedIndex];
                const rect = el.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                cursorDot.style.left = x + 'px';
                cursorDot.style.top = y + 'px';
                const ring = document.querySelector('.giant-cursor .cursor-ring');
                if (ring) {
                    ring.style.left = x + 'px';
                    ring.style.top = y + 'px';
                }
                // تمرير القائمة إلى العنصر المحدد
                el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        });

        // ================================================================
        //  12. بدء التحميل
        // ================================================================
        async function startLoading() {
            const firstBatch = allChannels.slice(0, 10);
            testingIndex = 10;
            const promises = firstBatch.map(ch => quickTest(ch.url));
            const results = await Promise.all(promises);
            const firstActive = [];
            firstBatch.forEach((ch, idx) => {
                if (results[idx]) {
                    firstActive.push(ch);
                }
            });
            activeChannels = firstActive;

            loadingScreen.classList.add('hidden');
            mainApp.classList.add('visible');

            // عرض القنوات النشطة الأولى
            renderActiveChannels('');
            if (activeChannels.length > 0) {
                playChannel(activeChannels[0]);
                // محاولة التكبير التلقائي
                setTimeout(() => {
                    const playerArea = document.getElementById('playerArea');
                    if (!document.fullscreenElement) {
                        playerArea.requestFullscreen().catch(() => {});
                    }
                }, 1000);
            } else {
                document.getElementById('watermarkText').textContent = '⚡ جاري البحث...';
            }

            const percent = Math.round((testingIndex / allChannels.length) * 100);
            progressFill.style.width = percent + '%';
            progressPercent.textContent = percent + '%';

            setTimeout(testNextBatch, 5000);
        }

        // ================================================================
        //  13. أحداث الفيديو
        // ================================================================
        video.addEventListener('canplay', () => {});
        video.addEventListener('error', (e) => {
            console.warn('فيديو خطأ، قد تكون القناة توقفت');
            if (currentChannel) {
                const url = currentChannel.url;
                const index = activeChannels.findIndex(ch => ch.url === url);
                if (index !== -1) {
                    activeChannels.splice(index, 1);
                    renderActiveChannels(document.getElementById('searchInput').value);
                    if (activeChannels.length > 0) {
                        playChannel(activeChannels[0]);
                    } else {
                        video.pause();
                        currentChannel = null;
                        document.getElementById('watermarkText').textContent = '⚡ لا توجد قنوات شغالة';
                    }
                }
            }
        });

        // زر التكبير اليدوي
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            const playerArea = document.getElementById('playerArea');
            if (!document.fullscreenElement) {
                playerArea.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        });

        // ================================================================
        //  14. بدء التشغيل
        // ================================================================
        window.addEventListener('DOMContentLoaded', startLoading);
    </script>
</body>
</html>
